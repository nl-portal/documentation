<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F2D5E" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#94A3B8"/>
    </marker>
    <marker id="arr-down" markerWidth="7" markerHeight="8" refX="3.5" refY="7" orient="auto">
      <polygon points="0 0, 7 0, 3.5 8" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#EEF4FB"/>

  <!-- Header -->
  <rect width="900" height="62" fill="#0F2D5E"/>
  <text x="450" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Externe Klanttaak — Taak V2</text>
  <text x="450" y="53" font-size="12" fill="#93C5FD" text-anchor="middle">Hoe een taak van zaakafhandelingssysteem tot burger loopt</text>

  <!-- ════════════════════════════ -->
  <!-- ROW 1: Stappen 1, 2, 3      -->
  <!-- ════════════════════════════ -->

  <!-- Step 1: x=39, w=258 -->
  <rect x="39" y="82" width="226" height="110" fill="white" rx="10" filter="url(#shadow)"/>
  <circle cx="39" cy="82" r="0"/>
  <!-- step number -->
  <circle cx="62" cy="105" r="18" fill="#1E6BB8"/>
  <text x="62" y="111" font-size="14" font-weight="800" fill="white" text-anchor="middle">1</text>
  <!-- content -->
  <text x="155" y="107" font-size="12" font-weight="700" fill="#0F2D5E" text-anchor="middle">Taak aanmaken</text>
  <line x1="52" y1="118" x2="252" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  <text x="155" y="135" font-size="11" fill="#334155" text-anchor="middle">Zaakafhandelingscomponent</text>
  <text x="155" y="151" font-size="11" fill="#334155" text-anchor="middle">maakt taak aan in</text>
  <text x="155" y="167" font-size="11" font-weight="600" fill="#1E6BB8" text-anchor="middle">Objecten API</text>
  <!-- actor label -->
  <rect x="82" y="180" width="147" height="6" fill="#DBEAFE" rx="3"/>
  <text x="155" y="187" font-size="9" fill="#64748B" text-anchor="middle">ZAC / Zaakafhandelingscomponent</text>

  <!-- Arrow 1→2 -->
  <line x1="267" y1="137" x2="295" y2="137" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: x=297, w=226 -->
  <rect x="297" y="82" width="226" height="110" fill="white" rx="10" filter="url(#shadow)"/>
  <circle cx="320" cy="105" r="18" fill="#6D28D9"/>
  <text x="320" y="111" font-size="14" font-weight="800" fill="white" text-anchor="middle">2</text>
  <text x="410" y="107" font-size="12" font-weight="700" fill="#0F2D5E" text-anchor="middle">Notificatie</text>
  <line x1="308" y1="118" x2="510" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  <text x="410" y="135" font-size="11" fill="#334155" text-anchor="middle">Notificatieservice stuurt</text>
  <text x="410" y="151" font-size="11" fill="#334155" text-anchor="middle">bericht naar NL Portal</text>
  <text x="410" y="167" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">Notificaties API</text>
  <rect x="337" y="180" width="147" height="6" fill="#EDE9FE" rx="3"/>
  <text x="410" y="187" font-size="9" fill="#64748B" text-anchor="middle">Open Notificaties</text>

  <!-- Arrow 2→3 -->
  <line x1="525" y1="137" x2="553" y2="137" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: x=555, w=226 -->
  <rect x="555" y="82" width="226" height="110" fill="white" rx="10" filter="url(#shadow)"/>
  <circle cx="578" cy="105" r="18" fill="#0E7B48"/>
  <text x="578" y="111" font-size="14" font-weight="800" fill="white" text-anchor="middle">3</text>
  <text x="668" y="107" font-size="12" font-weight="700" fill="#0F2D5E" text-anchor="middle">Burger ziet taak</text>
  <line x1="566" y1="118" x2="768" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  <text x="668" y="135" font-size="11" fill="#334155" text-anchor="middle">Burger logt in via DigiD</text>
  <text x="668" y="151" font-size="11" fill="#334155" text-anchor="middle">Taak verschijnt in</text>
  <text x="668" y="167" font-size="11" font-weight="600" fill="#0E7B48" text-anchor="middle">MijnTaken</text>
  <rect x="595" y="180" width="147" height="6" fill="#DCFCE7" rx="3"/>
  <text x="668" y="187" font-size="9" fill="#64748B" text-anchor="middle">NL Portal Frontend</text>

  <!-- Corner arrow from step 3 down to row 2 -->
  <path d="M 781 137 L 861 137 L 861 243 L 781 243" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ════════════════════════════ -->
  <!-- ROW 2: Stappen 4, 5, 6      -->
  <!-- ════════════════════════════ -->

  <!-- Step 4: x=555 (rechts), w=226 -->
  <rect x="555" y="193" width="226" height="110" fill="white" rx="10" filter="url(#shadow)"/>
  <circle cx="578" cy="216" r="18" fill="#C05621"/>
  <text x="578" y="222" font-size="14" font-weight="800" fill="white" text-anchor="middle">4</text>
  <text x="668" y="218" font-size="12" font-weight="700" fill="#0F2D5E" text-anchor="middle">Burger voert uit</text>
  <line x1="566" y1="229" x2="768" y2="229" stroke="#E2E8F0" stroke-width="1"/>
  <text x="668" y="246" font-size="11" fill="#334155" text-anchor="middle">Formulier · betaling · URL-taak</text>
  <text x="668" y="262" font-size="11" fill="#334155" text-anchor="middle">Actie voltooid in portaal</text>
  <rect x="595" y="290" width="147" height="6" fill="#FFEDD5" rx="3"/>
  <text x="668" y="297" font-size="9" fill="#64748B" text-anchor="middle">MijnTaken (FormIO / betaling)</text>

  <!-- Arrow 4→5 -->
  <line x1="553" y1="248" x2="525" y2="248" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" transform="rotate(180 539 248)"/>

  <!-- Step 5: x=297, w=226 -->
  <rect x="297" y="193" width="226" height="110" fill="white" rx="10" filter="url(#shadow)"/>
  <circle cx="320" cy="216" r="18" fill="#1E6BB8"/>
  <text x="320" y="222" font-size="14" font-weight="800" fill="white" text-anchor="middle">5</text>
  <text x="410" y="218" font-size="12" font-weight="700" fill="#0F2D5E" text-anchor="middle">Status bijwerken</text>
  <line x1="308" y1="229" x2="510" y2="229" stroke="#E2E8F0" stroke-width="1"/>
  <text x="410" y="246" font-size="11" fill="#334155" text-anchor="middle">NL Portal werkt taakstatus bij</text>
  <text x="410" y="262" font-size="11" fill="#334155" text-anchor="middle">in de Objecten API</text>
  <text x="410" y="278" font-size="11" font-weight="600" fill="#1E6BB8" text-anchor="middle">Taak → afgerond</text>

  <!-- Arrow 5→6 -->
  <line x1="295" y1="248" x2="267" y2="248" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" transform="rotate(180 281 248)"/>

  <!-- Step 6: x=39, w=226 -->
  <rect x="39" y="193" width="226" height="110" fill="white" rx="10" filter="url(#shadow)"/>
  <circle cx="62" cy="216" r="18" fill="#0E7B48"/>
  <text x="62" y="222" font-size="14" font-weight="800" fill="white" text-anchor="middle">6</text>
  <text x="155" y="218" font-size="12" font-weight="700" fill="#0F2D5E" text-anchor="middle">ZAC genotificeerd</text>
  <line x1="52" y1="229" x2="252" y2="229" stroke="#E2E8F0" stroke-width="1"/>
  <text x="155" y="246" font-size="11" fill="#334155" text-anchor="middle">Zaakafhandelingscomponent</text>
  <text x="155" y="262" font-size="11" fill="#334155" text-anchor="middle">verwerkt de afsluiting</text>
  <text x="155" y="278" font-size="11" font-weight="600" fill="#0E7B48" text-anchor="middle">Taak verdwijnt uit wachtrij</text>

  <!-- Note at bottom -->
  <rect x="39" y="318" width="822" height="36" fill="#FEF9C3" rx="8"/>
  <text x="450" y="330" font-size="10" fill="#854D0E" text-anchor="middle" font-weight="600">Let op:</text>
  <text x="490" y="330" font-size="10" fill="#854D0E">Taken zijn archiefobjecten met bewaarplicht. NL Portal mag taken tonen maar niet verwijderen —</text>
  <text x="450" y="345" font-size="10" fill="#854D0E" text-anchor="middle">dat is de verantwoordelijkheid van het zaakafhandelingscomponent.</text>
</svg>
